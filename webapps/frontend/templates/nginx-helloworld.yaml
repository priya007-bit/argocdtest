apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-helloworld
  labels:
    app: nginx-helloworld
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-helloworld
  template:
    metadata:
      labels:
        app: nginx-helloworld
    spec:
      containers:
      - name: nginx
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: helloworld-html

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: helloworld-html
data:
  index.html: |
    <html>
    <head><title>Hello from NGINX</title></head>
    <body>
      <h1>Hello, World!</h1>
      <p>This is a simple NGINX HelloWorld app running on Kubernetes.</p>
    </body>
    </html>

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-helloworld-service
spec:
  selector:
    app: nginx-helloworld
  ports:
  - protocol: TCP
    port: 80
    targetPort: {{ .Values.service.port }}
  type: NodePort
